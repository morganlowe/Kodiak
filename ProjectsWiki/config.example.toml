# BenchBear Configuration Template
# Copy to ~/.config/benchbear/wiki.toml or ./wiki.toml
# (Also compatible with ~/.config/kodiak/wiki.toml when embedded in Kodiak)

site_name = "BenchBear"

# Directory where your local project repositories and hardware builds are stored.
projects_dir = "~/Projects"

# Writable user data directory for the SQLite inventory DB, snapshot JSON, and audit log.
data_dir = "~/.local/share/kodiak/projectswiki-data"

# Domain name for browser access (default: "benchbear.localhost")
site_domain = "benchbear.localhost"

# Local Ollama configuration for doc synthesis & AI tuning
ollama_url = "http://127.0.0.1:11434"
ollama_model = "qwen2.5-coder:7b"

# Service ports
port_web = 8000
port_api = 8765
port_inventory = 8090

# Inventory & label defaults
default_currency = "USD"
# Supported presets: "2x1", "2.25x1.25", "ql62x29", "ql62x42"
default_label_preset = "2x1"

# Externalized project overrides JSON (persists manual title, category, and overview edits across rebuilds)
overrides_file = "~/.config/benchbear/project_overrides.json"

[categories]
"Hardware & Electronics" = ["hardware", "pcb", "circuit", "kicad", "schematic", "sensor", "display", "eink", "oled"]
"Embedded & Firmware" = ["esp32", "rp2040", "pico", "arduino", "firmware", "iot", "wifi", "ble"]
"Software & Tools" = ["software", "cli", "app", "python", "rust", "desktop", "web", "tool", "server"]
"Robotics & Mechanical" = ["robot", "mechanical", "motor", "cad", "3d", "stl", "engine"]
"Audio & Media" = ["audio", "midi", "synth", "sampler", "sound", "dsp"]
"General & Prototypes" = []
